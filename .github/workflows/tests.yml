name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '11'
            framework: '^11.0'
            testbench: '^9.0'
          - laravel: '12'
            framework: '^12.0'
            testbench: '^10.0'
          - laravel: '13'
            framework: '^13.0'
            testbench: '^11.0'
    name: PHP 8.4 / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Install Laravel 11 dependencies (advisory reporting only)
        if: matrix.laravel == '11'
        run: composer update --prefer-dist --no-interaction --no-scripts --no-security-blocking --with laravel/framework:${{ matrix.framework }} --with orchestra/testbench:${{ matrix.testbench }}
      - name: Install Laravel 12/13 dependencies
        if: matrix.laravel != '11'
        run: composer update --prefer-dist --no-interaction --no-scripts --with laravel/framework:${{ matrix.framework }} --with orchestra/testbench:${{ matrix.testbench }}
      - run: composer validate --strict
      - run: composer test
      - name: Report Laravel 11 dependency advisories (non-gating)
        if: matrix.laravel == '11'
        continue-on-error: true
        run: composer audit --locked
      - name: Audit Laravel 12/13 dependencies
        if: matrix.laravel != '11'
        run: composer audit --locked
